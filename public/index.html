<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Staff Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-[#313338] text-gray-200 h-screen flex flex-col font-sans">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="fixed inset-0 bg-[#1e1f22] flex items-center justify-center p-4">
    <div class="bg-[#2b2d31] p-6 rounded-lg w-full max-w-sm space-y-4 shadow-xl">
      <h2 class="text-xl font-bold text-white text-center">Staff Login / Register</h2>
      <div id="authErr" class="text-red-400 text-xs text-center hidden"></div>
      <input id="userIn" class="w-full p-2 rounded bg-[#1e1f22] text-white focus:outline-none" placeholder="Username" />
      <input id="passIn" type="password" class="w-full p-2 rounded bg-[#1e1f22] text-white focus:outline-none" placeholder="Password" />
      <div class="flex gap-2">
        <button onclick="handleAuth('login')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 py-2 rounded font-semibold text-white">Login</button>
        <button onclick="handleAuth('register')" class="flex-1 bg-gray-600 hover:bg-gray-700 py-2 rounded font-semibold text-white">Register</button>
      </div>
    </div>
  </div>

  <!-- CHAT INTERFACE -->
  <div id="chatScreen" class="flex h-screen hidden">
    <!-- Sidebar -->
    <div class="w-60 bg-[#2b2d31] flex flex-col justify-between border-r border-[#1e1f22]">
      <div class="p-3">
        <h1 class="font-bold text-white border-b border-[#1e1f22] pb-2 mb-3">⛏️ Staff Headquarters</h1>
        <div class="text-xs uppercase text-gray-400 font-bold mb-2">Channels</div>
        <button onclick="switchChan('announcements')" class="w-full text-left px-2 py-1.5 rounded hover:bg-[#35373c] text-sm text-gray-300">📢 #announcements</button>
        <button onclick="switchChan('staff-general')" class="w-full text-left px-2 py-1.5 rounded hover:bg-[#35373c] text-sm text-gray-300">💬 #staff-general</button>
        <button onclick="switchChan('builders')" class="w-full text-left px-2 py-1.5 rounded hover:bg-[#35373c] text-sm text-gray-300">🔨 #builders</button>
      </div>

      <!-- User footer -->
      <div class="bg-[#232428] p-3 flex flex-col gap-2">
        <button id="toggleRegBtn" onclick="toggleReg()" class="hidden text-xs bg-amber-600 hover:bg-amber-700 text-white font-bold py-1 rounded">Lock Registration</button>
        <div class="flex justify-between items-center text-xs">
          <div><span id="myUsername" class="font-bold text-white"></span> <span id="myRole" class="text-emerald-400"></span></div>
          <button onclick="location.reload()" class="text-red-400 hover:underline">Exit</button>
        </div>
      </div>
    </div>

    <!-- Main Message Area -->
    <div class="flex-1 flex flex-col bg-[#313338]">
      <div class="h-12 border-b border-[#1e1f22] flex items-center px-4 font-bold text-white">
        #<span id="activeChan">staff-general</span>
      </div>
      <div id="messagesList" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <form onsubmit="send(event)" class="p-4 bg-[#313338]">
        <input id="msgInput" class="w-full bg-[#383a40] text-white px-4 py-2.5 rounded-lg focus:outline-none" placeholder="Message..." />
      </form>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = null;
    let currentChannel = 'staff-general';
    let allMessages = [];

    async function handleAuth(action) {
      const username = document.getElementById('userIn').value.trim();
      const password = document.getElementById('passIn').value.trim();
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, action })
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('authErr').innerText = data.error;
        document.getElementById('authErr').classList.remove('hidden');
        return;
      }
      currentUser = data.user;
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('chatScreen').classList.remove('hidden');
      document.getElementById('myUsername').innerText = currentUser.username;
      document.getElementById('myRole').innerText = `[${currentUser.role}]`;
      if (currentUser.role === 'Owner') document.getElementById('toggleRegBtn').classList.remove('hidden');
      renderMessages();
    }

    function switchChan(chan) {
      currentChannel = chan;
      document.getElementById('activeChan').innerText = chan;
      renderMessages();
    }

    function renderMessages() {
      const box = document.getElementById('messagesList');
      box.innerHTML = '';
      allMessages.filter(m => m.channel === currentChannel).forEach(m => {
        box.innerHTML += `
          <div>
            <span class="font-bold text-white">${m.user}</span>
            <span class="text-[10px] bg-gray-700 px-1 rounded text-gray-300 font-mono">${m.role}</span>
            <span class="text-xs text-gray-500">${m.time}</span>
            <div class="text-sm text-gray-300">${m.text}</div>
          </div>`;
      });
      box.scrollTop = box.scrollHeight;
    }

    function send(e) {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      if (!input.value.trim()) return;
      socket.emit('send_msg', { user: currentUser, channel: currentChannel, text: input.value });
      input.value = '';
    }

    async function toggleReg() {
      const res = await fetch('/api/toggle-reg', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser.username })
      });
      const data = await res.json();
      const btn = document.getElementById('toggleRegBtn');
      btn.innerText = data.regOpen ? 'Lock Registration' : 'Open Registration';
      btn.className = data.regOpen ? 'text-xs bg-amber-600 text-white font-bold py-1 rounded' : 'text-xs bg-green-600 text-white font-bold py-1 rounded';
    }

    socket.on('init_messages', (msgs) => { allMessages = msgs; renderMessages(); });
    socket.on('new_msg', (msg) => { allMessages.push(msg); renderMessages(); });
    socket.on('error_msg', (err) => alert(err));
  </script>
</body>
</html>
