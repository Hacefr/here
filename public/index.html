<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Minecraft Staff Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .drawer-left, .drawer-right {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #202225; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#313338] text-gray-200 h-[100dvh] flex flex-col font-sans overflow-hidden select-none">

  <!-- 1. AUTH SCREEN -->
  <div id="authScreen" class="fixed inset-0 bg-[#1e1f22] flex items-center justify-center p-4 z-50">
    <div class="bg-[#2b2d31] p-6 rounded-xl w-full max-w-sm space-y-4 shadow-2xl border border-gray-800">
      <div class="text-center">
        <h2 class="text-xl font-bold text-white tracking-wide">⚔️ Staff Terminal</h2>
        <p class="text-xs text-gray-400 mt-1">Minecraft Server Administration</p>
      </div>
      <div id="authErr" class="text-red-400 text-xs text-center hidden bg-red-900/30 p-2 rounded border border-red-800"></div>
      <input id="userIn" class="w-full p-2.5 rounded bg-[#1e1f22] text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 text-sm" placeholder="Minecraft Username" />
      <input id="passIn" type="password" class="w-full p-2.5 rounded bg-[#1e1f22] text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 text-sm" placeholder="Password" />
      <div class="flex gap-2 pt-1">
        <button onclick="auth('login')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 py-2.5 rounded font-semibold text-white text-sm transition">Login</button>
        <button onclick="auth('register')" class="flex-1 bg-gray-600 hover:bg-gray-700 py-2.5 rounded font-semibold text-white text-sm transition">Register</button>
      </div>
    </div>
  </div>

  <!-- 2. MAIN APPLICATION -->
  <div id="chatScreen" class="flex flex-col h-full hidden">

    <!-- TOP APP BAR -->
    <header class="h-14 bg-[#2b2d31] border-b border-[#1e1f22] flex items-center justify-between px-3 z-20 shrink-0">
      <!-- Left: Mobile Channels Drawer Button & Active Channel Title -->
      <div class="flex items-center gap-2">
        <button onclick="toggleDrawer('left')" class="p-2 rounded hover:bg-[#35373c] text-gray-300 md:hidden active:scale-95">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="font-bold text-white flex items-center gap-1.5 truncate">
          <span class="text-gray-500 font-normal">#</span>
          <span id="activeChanTitle" class="truncate max-w-[150px] sm:max-w-xs">loading...</span>
        </div>
      </div>

      <!-- Right: Channel Action Buttons & Member Drawer Button -->
      <div class="flex items-center gap-1.5">
        <div id="chanActions" class="hidden flex gap-1">
          <button onclick="openChannelModal(currentChannelId)" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-2 py-1 rounded">Edit</button>
          <button onclick="deleteCurrentChannel()" class="text-xs bg-red-600/80 hover:bg-red-600 text-white px-2 py-1 rounded">Delete</button>
        </div>
        <button id="adminBtn" onclick="openModal('adminModal')" class="hidden text-xs bg-indigo-600 hover:bg-indigo-700 px-2.5 py-1.5 rounded font-semibold text-white">
          ⚙️ <span class="hidden sm:inline">Settings</span>
        </button>
        <button onclick="toggleDrawer('right')" class="p-2 rounded hover:bg-[#35373c] text-gray-300 md:hidden active:scale-95">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- CONTENT VIEWPORT -->
    <div class="flex flex-1 relative overflow-hidden">
      <!-- Dark Backdrop for Mobile Drawers -->
      <div id="backdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/60 z-25 hidden md:hidden transition-opacity"></div>

      <!-- LEFT DRAWER: Channels & User Badge -->
      <aside id="leftDrawer" class="drawer-left fixed md:static inset-y-0 left-0 z-30 w-72 md:w-60 bg-[#2b2d31] flex flex-col justify-between border-r border-[#1e1f22] -translate-x-full md:translate-x-0 shadow-2xl md:shadow-none">
        <div class="p-3 overflow-y-auto">
          <div class="flex items-center justify-between pb-2 mb-3 border-b border-[#1e1f22]">
            <span class="font-bold text-white tracking-wide">⚔️ MC Staff</span>
            <button onclick="toggleDrawer('left')" class="p-1 text-gray-400 hover:text-white md:hidden">✕</button>
          </div>

          <div class="flex items-center justify-between text-xs uppercase text-gray-400 font-bold mb-2 px-1">
            <span>Channels</span>
            <button id="addChanBtn" onclick="openChannelModal()" class="hidden text-lg leading-none hover:text-white font-bold" title="Create Channel">+</button>
          </div>
          <div id="channelList" class="space-y-1"></div>
        </div>

        <!-- User Profile Card -->
        <div class="bg-[#232428] p-3 flex justify-between items-center border-t border-[#1e1f22]">
          <div class="flex items-center gap-2 truncate">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white text-xs shrink-0" id="userAvatar">?</div>
            <div class="truncate">
              <div id="myUsername" class="font-bold text-white text-xs truncate"></div>
              <div id="myRole" class="text-[10px] text-emerald-400 font-mono truncate"></div>
            </div>
          </div>
          <button onclick="location.reload()" class="text-xs text-red-400 hover:underline shrink-0">Exit</button>
        </div>
      </aside>

      <!-- CENTER: Message Feed & Input -->
      <main class="flex-1 flex flex-col bg-[#313338] h-full overflow-hidden">
        <div id="messagesList" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

        <form onsubmit="sendMessage(event)" class="p-3 bg-[#313338] border-t border-[#2b2d31]">
          <div class="relative flex items-center">
            <input id="msgInput" autocomplete="off" class="w-full bg-[#383a40] text-white px-4 py-2.5 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 placeholder-gray-500 pr-12" placeholder="Message..." />
            <button type="submit" class="absolute right-2 p-1.5 rounded-md bg-indigo-600 hover:bg-indigo-700 text-white active:scale-95 transition">
              <svg class="w-4 h-4 transform rotate-90" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/>
              </svg>
            </button>
          </div>
        </form>
      </main>

      <!-- RIGHT DRAWER: Staff List & Moderation Controls -->
      <aside id="rightDrawer" class="drawer-right fixed md:static inset-y-0 right-0 z-30 w-72 md:w-56 bg-[#2b2d31] flex flex-col border-l border-[#1e1f22] translate-x-full md:translate-x-0 shadow-2xl md:shadow-none p-3 overflow-y-auto">
        <div class="flex items-center justify-between pb-2 mb-3 border-b border-[#1e1f22]">
          <span class="text-xs uppercase text-gray-400 font-bold tracking-wider">Staff Members</span>
          <button onclick="toggleDrawer('right')" class="p-1 text-gray-400 hover:text-white md:hidden">✕</button>
        </div>
        <div id="memberList" class="space-y-2"></div>
      </aside>
    </div>
  </div>

  <!-- 3. MODALS (Owner Settings & Channel CRUD) -->
  <div id="adminModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-[#2b2d31] p-5 rounded-xl w-full max-w-sm space-y-4 border border-gray-700 shadow-2xl">
      <div class="flex justify-between items-center border-b border-[#1e1f22] pb-2">
        <h3 class="font-bold text-white text-base">Server Settings</h3>
        <button onclick="closeModal('adminModal')" class="text-gray-400 hover:text-white p-1">✕</button>
      </div>

      <!-- Registration Toggle -->
      <div class="p-3 bg-[#1e1f22] rounded-lg flex items-center justify-between">
        <div>
          <div class="text-xs font-semibold text-white">Staff Signups</div>
          <div class="text-[10px] text-gray-400">Allow new mod registrations</div>
        </div>
        <button id="toggleRegBtn" onclick="toggleReg()" class="text-xs px-2.5 py-1.5 rounded font-bold text-white"></button>
      </div>

      <!-- Create Role -->
      <div class="p-3 bg-[#1e1f22] rounded-lg space-y-2">
        <label class="text-xs uppercase text-gray-400 font-bold">Create New Role</label>
        <div class="flex gap-2">
          <input id="newRoleName" class="flex-1 bg-[#2b2d31] px-2.5 py-1.5 text-xs rounded text-white focus:outline-none border border-gray-700" placeholder="e.g. Builder" />
          <button onclick="createRole()" class="bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 text-xs font-bold rounded text-white">Add</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Channel Create / Edit Modal -->
  <div id="channelModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-[#2b2d31] p-5 rounded-xl w-full max-w-sm space-y-4 border border-gray-700 shadow-2xl">
      <div class="flex justify-between items-center border-b border-[#1e1f22] pb-2">
        <h3 id="chanModalTitle" class="font-bold text-white text-base">Create Channel</h3>
        <button onclick="closeModal('channelModal')" class="text-gray-400 hover:text-white p-1">✕</button>
      </div>

      <input id="chanNameIn" class="w-full bg-[#1e1f22] p-2 text-sm rounded text-white focus:outline-none border border-gray-700" placeholder="channel-name" />

      <label class="flex items-center gap-2 text-xs">
        <input type="checkbox" id="chanReadOnlyIn" class="rounded bg-[#1e1f22]" />
        <span>Read-Only (Owner announcement mode)</span>
      </label>

      <div>
        <label class="text-xs uppercase text-gray-400 font-bold block mb-1">Allowed Roles (Blank = Everyone)</label>
        <div id="roleCheckboxes" class="space-y-1.5 bg-[#1e1f22] p-2.5 rounded max-h-32 overflow-y-auto"></div>
      </div>

      <button onclick="saveChannel()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-2 rounded text-xs font-bold text-white">Save Channel</button>
    </div>
  </div>

  <!-- 4. APP LOGIC -->
  <script>
    const socket = io();
    let state = { users: [], roles: [], channels: [], messages: [], settings: {} };
    let currentUser = null;
    let currentChannelId = null;
    let editingChannelId = null;

    const leftDrawer = document.getElementById('leftDrawer');
    const rightDrawer = document.getElementById('rightDrawer');
    const backdrop = document.getElementById('backdrop');

    // Mobile Drawer Handlers
    function toggleDrawer(side) {
      if (side === 'left') {
        const isClosed = leftDrawer.classList.contains('-translate-x-full');
        closeAllDrawers();
        if (isClosed) {
          leftDrawer.classList.remove('-translate-x-full');
          backdrop.classList.remove('hidden');
        }
      } else {
        const isClosed = rightDrawer.classList.contains('translate-x-full');
        closeAllDrawers();
        if (isClosed) {
          rightDrawer.classList.remove('translate-x-full');
          backdrop.classList.remove('hidden');
        }
      }
    }

    function closeAllDrawers() {
      leftDrawer.classList.add('-translate-x-full');
      rightDrawer.classList.add('translate-x-full');
      backdrop.classList.add('hidden');
    }

    async function syncState() {
      const res = await fetch('/api/state');
      state = await res.json();
      renderUI();
    }

    async function auth(action) {
      const username = document.getElementById('userIn').value.trim();
      const password = document.getElementById('passIn').value.trim();
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, action })
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('authErr').innerText = data.error;
        document.getElementById('authErr').classList.remove('hidden');
        return;
      }

      currentUser = data.user;
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('chatScreen').classList.remove('hidden');
      document.getElementById('myUsername').innerText = currentUser.username;
      document.getElementById('myRole').innerText = `[${currentUser.role}]`;
      document.getElementById('userAvatar').innerText = currentUser.username[0].toUpperCase();

      if (currentUser.role === 'Owner') {
        document.getElementById('adminBtn').classList.remove('hidden');
        document.getElementById('addChanBtn').classList.remove('hidden');
      }

      await syncState();
      if (state.channels.length > 0) switchChan(state.channels[0].id);
    }

    function switchChan(id) {
      currentChannelId = id;
      closeAllDrawers();
      renderMessages();
      renderUI();
    }

    function renderUI() {
      // Render Channel List
      const chanBox = document.getElementById('channelList');
      chanBox.innerHTML = '';

      const visibleChannels = state.channels.filter(c => {
        if (currentUser.role === 'Owner') return true;
        if (c.allowedRoles.includes('*') || c.allowedRoles.includes(currentUser.role)) return true;
        return false;
      });

      visibleChannels.forEach(c => {
        const isActive = c.id === currentChannelId;
        chanBox.innerHTML += `
          <button onclick="switchChan('${c.id}')" class="w-full text-left px-3 py-2 rounded flex items-center justify-between text-sm ${isActive ? 'bg-[#35373c] text-white font-medium' : 'text-gray-400 hover:bg-[#35373c]/60 hover:text-white'}">
            <span class="truncate"># ${c.name}</span>
            ${c.isReadOnly ? '<span class="text-[9px] bg-[#1e1f22] px-1 py-0.5 rounded text-gray-400 border border-gray-700">Lock</span>' : ''}
          </button>
        `;
      });

      const currentChan = state.channels.find(c => c.id === currentChannelId);
      if (currentChan) {
        document.getElementById('activeChanTitle').innerText = currentChan.name;
        document.getElementById('chanActions').style.display = currentUser.role === 'Owner' ? 'flex' : 'none';
        
        const isRestricted = currentChan.isReadOnly && currentUser.role !== 'Owner';
        document.getElementById('msgInput').placeholder = isRestricted 
          ? 'Only the Owner can post announcements.' 
          : `Message #${currentChan.name}...`;
        document.getElementById('msgInput').disabled = isRestricted;
      }

      // Render Member List
      const memberBox = document.getElementById('memberList');
      memberBox.innerHTML = '';
      state.users.forEach(u => {
        let ownerActions = '';
        if (currentUser.role === 'Owner' && u.username !== currentUser.username) {
          const roleOptions = state.roles.map(r => `<option value="${r.name}" ${u.role === r.name ? 'selected' : ''}>${r.name}</option>`).join('');
          ownerActions = `
            <div class="mt-1 flex gap-1 pt-1">
              <select onchange="changeRole('${u.username}', this.value)" class="bg-[#2b2d31] text-[10px] rounded text-white p-1 flex-1 border border-gray-700">
                ${roleOptions}
              </select>
              <button onclick="toggleBan('${u.username}')" class="text-[10px] ${u.isBanned ? 'bg-emerald-600' : 'bg-red-600/80 hover:bg-red-600'} text-white px-2 py-1 rounded font-bold">
                ${u.isBanned ? 'Unban' : 'Ban'}
              </button>
            </div>
          `;
        }

        memberBox.innerHTML += `
          <div class="p-2 rounded bg-[#1e1f22]/60 border border-gray-800 ${u.isBanned ? 'opacity-40' : ''}">
            <div class="font-semibold text-white text-xs flex justify-between">
              <span>${u.username}</span>
              ${u.isBanned ? '<span class="text-[9px] text-red-500 font-bold uppercase">BANNED</span>' : ''}
            </div>
            <div class="text-[10px] text-emerald-400 font-mono mt-0.5">[${u.role}]</div>
            ${ownerActions}
          </div>
        `;
      });

      // Settings Status
      const regBtn = document.getElementById('toggleRegBtn');
      regBtn.innerText = state.settings.regOpen ? 'Lock' : 'Open';
      regBtn.className = state.settings.regOpen ? 'text-xs px-2.5 py-1.5 rounded font-bold bg-amber-600 text-white' : 'text-xs px-2.5 py-1.5 rounded font-bold bg-emerald-600 text-white';
    }

    function renderMessages() {
      const box = document.getElementById('messagesList');
      box.innerHTML = '';
      state.messages.filter(m => m.channelId === currentChannelId).forEach(m => {
        box.innerHTML += `
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white text-xs shrink-0 mt-0.5">
              ${m.user[0].toUpperCase()}
            </div>
            <div class="min-w-0">
              <div class="flex items-baseline gap-2 flex-wrap">
                <span class="font-bold text-white text-sm">${m.user}</span>
                <span class="text-[10px] bg-gray-700 px-1 rounded text-gray-300 font-mono">${m.role}</span>
                <span class="text-[10px] text-gray-500">${m.time}</span>
              </div>
              <div class="text-sm text-gray-300 mt-0.5 break-words">${m.text}</div>
            </div>
          </div>
        `;
      });
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      if (!input.value.trim() || !currentChannelId) return;
      socket.emit('send_msg', { user: currentUser, channelId: currentChannelId, text: input.value });
      input.value = '';
    }

    // Owner Operations
    async function toggleReg() {
      await fetch('/api/toggle-reg', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser.username })
      });
    }

    async function createRole() {
      const name = document.getElementById('newRoleName').value.trim();
      if (!name) return;
      await fetch('/api/roles/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser.username, roleName: name })
      });
      document.getElementById('newRoleName').value = '';
      closeModal('adminModal');
    }

    async function changeRole(targetUsername, newRole) {
      await fetch('/api/users/set-role', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser.username, targetUsername, newRole })
      });
    }

    async function toggleBan(targetUsername) {
      await fetch('/api/users/toggle-ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser.username, targetUsername })
      });
    }

    function openChannelModal(id = null) {
      editingChannelId = id;
      const modal = document.getElementById('channelModal');
      const title = document.getElementById('chanModalTitle');
      const nameIn = document.getElementById('chanNameIn');
      const readOnlyIn = document.getElementById('chanReadOnlyIn');
      const rolesBox = document.getElementById('roleCheckboxes');

      rolesBox.innerHTML = '';
      const existing = id ? state.channels.find(c => c.id === id) : null;

      title.innerText = id ? 'Edit Channel' : 'Create Channel';
      nameIn.value = existing ? existing.name : '';
      readOnlyIn.checked = existing ? existing.isReadOnly : false;

      state.roles.forEach(r => {
        const isChecked = existing ? existing.allowedRoles.includes(r.name) || existing.allowedRoles.includes('*') : true;
        rolesBox.innerHTML += `
          <label class="flex items-center gap-2 text-xs text-gray-300">
            <input type="checkbox" value="${r.name}" class="role-check rounded bg-[#2b2d31]" ${isChecked ? 'checked' : ''} />
            <span>${r.name}</span>
          </label>
        `;
      });

      modal.classList.remove('hidden');
    }

    async function saveChannel() {
      const name = document.getElementById('chanNameIn').value.trim();
      const isReadOnly = document.getElementById('chanReadOnlyIn').checked;
      const allowedRoles = Array.from(document.querySelectorAll('.role-check:checked')).map(el => el.value);

      await fetch('/api/channels/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: currentUser.username,
          id: editingChannelId,
          name,
          isReadOnly,
          allowedRoles: allowedRoles.length === state.roles.length ? ['*'] : allowedRoles
        })
      });
      closeModal('channelModal');
    }

    async function deleteCurrentChannel() {
      if (!confirm('Are you sure you want to delete this channel?')) return;
      await fetch('/api/channels/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser.username, channelId: currentChannelId })
      });
      currentChannelId = state.channels[0]?.id || null;
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // Socket Event Subscriptions
    socket.on('sync_data', () => syncState());
    socket.on('new_msg', (msg) => {
      state.messages.push(msg);
      if (msg.channelId === currentChannelId) renderMessages();
    });
    socket.on('error_msg', (err) => alert(err));
    socket.on('user_banned_event', (e) => {
      if (currentUser && currentUser.username === e.username && e.isBanned) {
        alert('You have been banned from this server.');
        location.reload();
      }
    });
  </script>
</body>
</html>
